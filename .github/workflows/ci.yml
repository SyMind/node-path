name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: cargo +1.88.0 test --all-targets --all-features --no-run --locked

  conformance:
    name: Rust 1.97.1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo +1.97.1 fmt --all -- --check
      - run: cargo +1.97.1 clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.97.1 test --all-targets --all-features --locked
